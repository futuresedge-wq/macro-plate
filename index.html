<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A week of easy meals portioned to your calories and macros, with a grocery list.">
<meta name="theme-color" content="#1E6A48">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Macro Plate">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Macro Plate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one-column kitchen app. Masthead greets the person, tab bar (top on desktop, bottom on phones), meals shown as order tickets. */
:root{
  --bg:#EEF2EC; --surface:#FFFFFF; --surface-2:#F6F8F4; --ink:#16211A; --muted:#5B685F; --line:#D5DDD2;
  --accent:#1E6A48; --accent-ink:#FFFFFF; --accent-soft:#DCEBE2;
  --pro:#2F5ED6; --carb:#B97E0C; --fat:#C23E78;
  --good:#1E7A4C; --warn:#A86A00; --bad:#B8352C;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111713; --surface:#19211C; --surface-2:#1F2923; --ink:#E6EDE8; --muted:#97A69C; --line:#2D3932;
  --accent:#5CC490; --accent-ink:#0D1A12; --accent-soft:#1F3A2B;
  --pro:#86A6FF; --carb:#E6B54E; --fat:#F282B2;
  --good:#5CC490; --warn:#E6B54E; --bad:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111713; --surface:#19211C; --surface-2:#1F2923; --ink:#E6EDE8; --muted:#97A69C; --line:#2D3932;
  --accent:#5CC490; --accent-ink:#0D1A12; --accent-soft:#1F3A2B;
  --pro:#86A6FF; --carb:#E6B54E; --fat:#F282B2;
  --good:#5CC490; --warn:#E6B54E; --bad:#FF8A80; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 48px}
@media (max-width:759px){body{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
#app{max-width:1080px;margin:0 auto;display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.note{font-size:.84rem;color:var(--muted);margin:0}
.fine{font-size:.78rem;color:var(--muted);margin:0}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.d-k{background:var(--ink)} .d-p{background:var(--pro)} .d-c{background:var(--carb)} .d-f{background:var(--fat)}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px 24px;border-bottom:2px solid var(--ink);padding-bottom:12px}
.brand{font-family:var(--display);font-weight:800;font-size:1rem;letter-spacing:-.01em}
.brand span{color:var(--accent)}
.mast h1{font-size:clamp(1.7rem,4.5vw,2.6rem);font-weight:800;letter-spacing:-.02em}
.mast .sub{color:var(--muted);margin:2px 0 0}

/* tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;font-family:var(--display);font-size:1rem;cursor:pointer;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;display:inline-flex;gap:7px;align-items:center;white-space:nowrap}
.tabs button svg{width:18px;height:18px}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
@media (max-width:759px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);border-bottom:0;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around;gap:0}
  .tabs button{flex-direction:column;gap:2px;font-family:var(--body);font-size:.7rem;font-weight:600;padding:6px 4px;border-bottom:0;margin:0;flex:1;min-width:0}
  .tabs button svg{width:22px;height:22px}
  .tabs button.on{color:var(--accent)}
}

/* forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:16px}
.field{display:grid;gap:5px;min-width:0}
.field>label,.lbl{font-weight:600;font-size:.88rem;display:flex;align-items:center;gap:7px}
.inp{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);overflow:hidden}
.inp input{border:0;background:transparent;padding:11px 12px;width:100%;min-width:0;font-size:1rem}
.inp input[type=number]{font-family:var(--mono)}
.inp input:focus{outline:none}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.inp span{padding:0 12px;color:var(--muted);font-family:var(--mono);font-size:.85rem}
select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:inline-block;padding:8px 13px;border:1px solid var(--line);border-radius:99px;font-size:.88rem;font-weight:500;background:var(--surface-2)}
.chip input:checked + span{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.opt{position:relative}
.opt input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt div{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2);display:grid;gap:2px;height:100%}
.opt b{font-family:var(--display);font-size:1rem}
.opt small{color:var(--muted);font-size:.8rem}
.opt input:checked + div{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt input:focus-visible + div{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-size:1rem}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600;font-size:.88rem;padding:8px 12px}
.btn.ghost:hover{border-color:var(--ink)}
.btn.danger{background:var(--bad);color:#fff}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer;font-size:inherit}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.end{justify-content:space-between}
.err{color:var(--bad);font-size:.86rem;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:8px 13px;font-size:.88rem;font-weight:600;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.seg.wide{display:flex;width:100%}
.seg.wide button{flex:1 1 auto;justify-content:center}
.seg button svg{color:var(--fat)} .seg button.on svg{color:inherit}

/* setup wizard */
.wiz{max-width:640px;margin:0 auto;width:100%;display:grid;gap:18px;padding-top:4vh}
.wiz h1{font-size:clamp(1.9rem,5vw,2.8rem);font-weight:800;letter-spacing:-.02em}
.steps{display:flex;gap:6px}
.steps i{height:4px;flex:1;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.result{display:grid;gap:10px;background:var(--accent-soft);border-radius:10px;padding:14px}

/* summary + meters */
.sumhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:10px}
.sumhead h2{font-size:1.45rem}
.banner{background:var(--accent-soft);border-radius:10px;padding:12px 14px;font-size:.92rem;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.meters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){.meters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:6px}
.meter .top{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);font-weight:600}
.meter .val{font-family:var(--mono);font-size:1.3rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.meter .val small{font-size:.78rem;color:var(--muted);font-weight:400}
.bar{position:relative;height:6px;border-radius:3px;background:var(--surface-2)}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);left:calc(100%/1.2)}
.pill{font-family:var(--mono);font-size:.72rem;padding:2px 7px;border-radius:99px;font-weight:600;white-space:nowrap}
.pill.good{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.sd{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.sd.good{background:var(--good)} .sd.warn{background:var(--warn)} .sd.bad{background:var(--bad)}

/* week overview */
.weeklist{display:grid;gap:8px}
.wday{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.wday:hover{border-color:var(--ink)}
.wday.today{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.wday .dt{display:grid;line-height:1.2}
.wday .dt b{font-family:var(--display);font-size:1.05rem}
.wday .dt small{color:var(--muted);font-family:var(--mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em}
.wday ul{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:.9rem;min-width:0}
.wday li{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wday li em{font-style:normal;color:var(--muted);font-size:.78rem;font-family:var(--mono);text-transform:uppercase;letter-spacing:.06em;margin-right:6px}
.wday li.made{color:var(--muted);text-decoration:line-through}
.wday .kc{text-align:right;display:grid;gap:2px;justify-items:end;font-family:var(--mono);font-size:.84rem}
.wday .kc small{color:var(--muted)}
@media (max-width:520px){.wday{grid-template-columns:minmax(0,1fr) auto}.wday ul{grid-column:1/-1;grid-row:2}}
.daystrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.daystrip button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:.82rem;font-weight:600;display:grid;justify-items:center;line-height:1.2;min-width:62px}
.daystrip button small{font-family:var(--mono);font-weight:400;color:var(--muted);font-size:.72rem}
.daystrip button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.daystrip button.on small{color:var(--bg)}

/* tickets */
.tickets{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;min-width:0}
.ticket.made{opacity:.72}
.tk-head{display:flex;justify-content:space-between;gap:8px;padding:10px 16px;font-family:var(--mono);font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:2px dashed var(--line)}
.tk-head strong{color:var(--ink);font-weight:600}
.tk-body{padding:14px 16px 16px;display:grid;gap:12px;flex:1;align-content:start}
.tk-body h3{font-size:1.28rem;font-weight:700;letter-spacing:-.01em}
.rtitle{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tk-mac{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--mono);font-size:.84rem;font-variant-numeric:tabular-nums}
.tk-mac span{display:inline-flex;align-items:center;gap:5px}
.tk-mac .kc{font-weight:600}
.split{display:flex;height:5px;border-radius:3px;overflow:hidden;gap:2px}
.split i{display:block}
.ing{list-style:none;margin:0;padding:0;display:grid}
.ing li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.ing li:last-child{border-bottom:0}
.ing .amt{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:.86rem}
details{border-top:1px solid var(--line);padding-top:8px}
summary{cursor:pointer;font-weight:600;font-size:.92rem}
details ol{margin:8px 0 0;padding-left:20px;display:grid;gap:7px;font-size:.92rem}
details .ing{margin-top:8px}
.tk-foot{padding:0 16px 14px;display:flex;gap:8px;flex-wrap:wrap}
.made-btn.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fav{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 12px;font-weight:600;font-size:.88rem;cursor:pointer;color:var(--muted)}
.fav svg path{fill:transparent;stroke:currentColor;stroke-width:2}
.fav.on{color:var(--fat);border-color:color-mix(in srgb,var(--fat) 45%,var(--line))}
.fav.on svg path{fill:currentColor}
.fav.sm{padding:6px;border-radius:99px;flex:none}
.fav.sm span{display:none}

/* groceries */
.aisles{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.aisle{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.aisle h3{font-family:var(--mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:4px;display:flex;justify-content:space-between}
.buy label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;min-width:0}
.buy input{margin-top:3px;accent-color:var(--accent);flex:none;width:18px;height:18px}
.buy.got span{text-decoration:line-through;color:var(--muted)}
.progress{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--accent)}
.rbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.rbar .grow{flex:1 1 240px}
.rbar select{width:auto;flex:0 1 auto}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,140px),1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-family:var(--mono);font-size:1.1rem}
.stat span{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:759px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
@media (prefers-reduced-motion:no-preference){.ticket,.wday{animation:in .3s ease both}@keyframes in{from{transform:translateY(5px)}to{transform:none}}}
</style>

<div id="app"></div>
<div class="toast" id="toast" hidden></div>

<script>
// ---------- Ingredient data: per 100 g (kcal, protein, carbs, fat) ----------
// u = display unit {g: grams per unit, r: rounding step, lab, labPl}; ml = liquid shown in ml
const ING = {
  egg:{n:'Eggs',k:143,p:12.6,c:0.7,f:9.5,a:'Dairy & eggs',u:{g:50,r:1,lab:'large'}},
  eggw:{n:'Liquid egg whites',k:52,p:10.9,c:0.7,f:0.2,a:'Dairy & eggs',ml:1},
  yog:{n:'Plain Greek yogurt, 0%',k:59,p:10.3,c:3.6,f:0.4,a:'Dairy & eggs',dairy:1},
  milk:{n:'Milk, 1%',k:42,p:3.4,c:5,f:1,a:'Dairy & eggs',ml:1,dairy:1},

  feta:{n:'Feta, crumbled',k:264,p:14,c:4,f:21,a:'Dairy & eggs',dairy:1},
  cott:{n:'Cottage cheese, 2%',k:84,p:11,c:4.3,f:2.3,a:'Dairy & eggs',dairy:1},
  parm:{n:'Parmesan, grated',k:431,p:38,c:4,f:29,a:'Dairy & eggs',dairy:1},
  chick:{n:'Chicken breast, raw',k:120,p:22.5,c:0,f:2.6,a:'Meat & protein',meat:1},
  turkey:{n:'Ground turkey 93% lean, raw',k:150,p:18.7,c:0,f:8.3,a:'Meat & protein',meat:1},
  beef:{n:'Lean ground beef 90%, raw',k:176,p:20,c:0,f:10,a:'Meat & protein',meat:1},
  pork:{n:'Pork tenderloin, raw',k:120,p:21,c:0,f:3.5,a:'Meat & protein',meat:1},
  deli:{n:'Sliced deli turkey',k:104,p:18,c:3,f:2,a:'Meat & protein',meat:1},
  salmon:{n:'Salmon fillet, raw',k:208,p:20,c:0,f:13,a:'Meat & protein',fish:1},
  shrimp:{n:'Shrimp, peeled, raw',k:85,p:20,c:0,f:0.5,a:'Meat & protein',fish:1},
  tuna:{n:'Canned tuna in water, drained',k:116,p:25.5,c:0,f:0.8,a:'Meat & protein',fish:1},
  tofu:{n:'Extra-firm tofu',k:144,p:17,c:3,f:9,a:'Meat & protein'},
  oats:{n:'Rolled oats',k:379,p:13.2,c:67.7,f:6.5,a:'Pantry'},
  whey:{n:'Whey protein powder',k:400,p:80,c:8,f:6,a:'Pantry',dairy:1,u:{g:30,r:0.5,lab:'scoop',labPl:'scoops'}},
  chia:{n:'Chia seeds',k:486,p:17,c:42,f:31,a:'Pantry',u:{g:12,r:0.5,lab:'tbsp'}},
  pb:{n:'Peanut butter',k:588,p:25,c:20,f:50,a:'Pantry',u:{g:16,r:0.5,lab:'tbsp'}},
  almonds:{n:'Almonds',k:579,p:21,c:22,f:50,a:'Pantry'},
  tort:{n:'Whole-wheat tortillas',k:300,p:9,c:49,f:7.5,a:'Pantry',u:{g:70,r:0.5,lab:'large'}},
  bread:{n:'Whole-wheat bread',k:250,p:12,c:43,f:3.5,a:'Pantry',u:{g:40,r:0.5,lab:'slice',labPl:'slices'}},
  ricecake:{n:'Plain rice cakes',k:387,p:8,c:82,f:3,a:'Pantry',u:{g:9,r:1,lab:'cake',labPl:'cakes'}},
  rice:{n:'White rice, cooked',k:130,p:2.7,c:28.2,f:0.3,a:'Pantry'},

const LAYOUTS = {
  '2':  [{l:'Meal 1',pool:'bm',sh:.5},{l:'Meal 2',pool:'m',sh:.5}],
  '2s': [{l:'Meal 1',pool:'bm',sh:.42},{l:'Snack',pool:'s',sh:.16},{l:'Meal 2',pool:'m',sh:.42}],

// ---------- Planner ----------
const den=(x)=>Math.max(x,20);
function score(t,T){
  const e=(a,b)=>((a-b)/den(b))**2;
  return 1.6*e(t.k,T.k)+1.4*e(t.p,T.p)+1.0*e(t.c,T.c)+1.1*e(t.f,T.f);
}
function totals(rids,sc){const t={k:0,p:0,c:0,f:0};rids.forEach((id,i)=>{const r=R[id];t.k+=r.k*sc[i];t.p+=r.p*sc[i];t.c+=r.c*sc[i];t.f+=r.f*sc[i];});return t;}
function initScales(rids,slots,T){return rids.map((id,i)=>clampS(T.k*slots[i].sh/R[id].k));}
const clampS=s=>Math.min(2.5,Math.max(0.5,s));
function optimize(rids,slots,T){
  let sc=initScales(rids,slots,T), best=score(totals(rids,sc),T);
  for(const step of [0.2,0.1,0.05,0.025]){
    let improved=true,n=0;
    while(improved&&n++<40){
      improved=false;
      for(let i=0;i<rids.length;i++){
        for(const d of [step,-step]){
          const s=sc[i]+d; if(s<0.5||s>2.5)continue;
          const kc=s*R[rids[i]].k, nom=T.k*slots[i].sh;
          if(kc<0.55*nom||kc>1.6*nom)continue;
          const t2=sc.slice();t2[i]=s;const v=score(totals(rids,t2),T);
          if(v<best-1e-9){best=v;sc=t2;improved=true;}
        }
      }
    }
  }
  return {rids,sc,v:best};
}
function eligible(r){
  if(S.veg&&(r.meat||r.fish))return false;
  if(S.nofish&&r.fish)return false;
  if(S.df&&r.dairy)return false;
  if(S.maxT&&r.t>S.maxT)return false;
  return true;
}
function slotAccepts(sl,r){if(sl.pool.includes(r.cat))return true;if(r.cat!=='m')return false;
  return (sl.pool.includes('L')&&r.when!=='dinner')||(sl.pool.includes('D')&&r.when!=='lunch');}
function pools(slots){return slots.map(sl=>{let p=RECIPES.filter(r=>slotAccepts(sl,r)&&eligible(r));
  if(!p.length&&/[LD]/.test(sl.pool))p=RECIPES.filter(r=>r.cat==='m'&&eligible(r));return p.map(r=>r.id);});}
const pick=a=>a[Math.floor(Math.random()*a.length)];

const pen=(rids,used)=>rids.reduce((a,id)=>a+(used[id]||0)*0.004-(S.favBias&&isFav(id)?0.004:0),0);
function generate(used={}){
  const slots=LAYOUTS[S.layout], P=pools(slots);
  const emptyI=P.findIndex(p=>!p.length);
  if(emptyI>=0)return {error:`No recipes fit your filters for ${slots[emptyI].l.toLowerCase()}. Allow more cooking time or turn off a diet filter.`};
  const seen=new Set(),cands=[];
  for(let pass=0;pass<2&&!cands.length;pass++){
    for(let n=0;n<3000;n++){
      const rids=P.map(pick);
      if(pass===0&&new Set(rids).size<rids.length)continue;
      const key=rids.join();if(seen.has(key))continue;seen.add(key);
      cands.push({rids,v:score(totals(rids,initScales(rids,slots,S.T)),S.T)+pen(rids,used)});
    }
  }
  cands.sort((a,b)=>a.v-b.v);
  // optimize a random spread of the better candidates so each build gives a different day
  const shortlist=cands.slice(0,120).sort(()=>Math.random()-0.5).slice(0,40);
  const opt=shortlist.map(c=>{const o=optimize(c.rids,slots,S.T);o.v+=pen(o.rids,used);return o;}).sort((a,b)=>a.v-b.v);
  const top=opt.filter(o=>o.v<=opt[0].v*3+0.004).slice(0,10);
  const ch=pick(top);
  return {layout:S.layout,T:{...S.T},items:ch.rids.map((id,i)=>({id,s:ch.sc[i]}))};
}
function usage(skip){const u={};(S.week||[]).forEach((p,d)=>{if(d!==skip)p.items.forEach(x=>u[x.id]=(u[x.id]||0)+1);});return u;}
function generateWeek(){
  const week=[],used={};
  for(let d=0;d<7;d++){const p=generate(used);if(p.error)return {error:p.error};week.push(p);p.items.forEach(x=>used[x.id]=(used[x.id]||0)+1);}
  return week;
}
// ---------- Amount rounding & formatting ----------
function frac(c){const w=Math.floor(c+1e-9),h=c-w>0.25;return (w?String(w):'')+(h?'½':'')||'0';}
function roundAmt(id,g,ceil){
  const I=ING[id];
  if(I.u){const u=I.u;let c=g/u.g/u.r;c=(ceil?Math.ceil(c-1e-6):Math.round(c))*u.r;c=Math.max(u.r,c);
    const lab=(c>1&&u.labPl)?u.labPl:u.lab;return {g:c*u.g,label:`${frac(c)} ${lab}`};}
  let v; if(g<20)v=Math.round(g); else if(g<100)v=Math.round(g/5)*5; else v=Math.round(g/10)*10;
  v=Math.max(1,v); return {g:v,label:`${v.toLocaleString()} ${I.ml?'ml':'g'}`};
}
function buildItem(it){
  const r=R[it.id]; const t={k:0,p:0,c:0,f:0};
  const lines=r.ing.map(([id,g])=>{const a=roundAmt(id,g*it.s),I=ING[id];
    t.k+=I.k*a.g/100;t.p+=I.p*a.g/100;t.c+=I.c*a.g/100;t.f+=I.f*a.g/100;return {id,name:I.n,...a};});
  return {r,lines,t};
}

let cloud={ref:null,status:'local'};
function loadLocal(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s==='object')return Object.assign(structuredClone(BLANK),s);}catch(e){}return structuredClone(BLANK);}
let saveTimer;
function save(){
  S.savedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
  if(cloud.ref){clearTimeout(saveTimer);saveTimer=setTimeout(pushCloud,700);}
}
async function pushCloud(){
  if(!cloud.ref)return;
  const {view,q,...keep}=S; // per-screen UI state stays on the device
  try{await cloud.ref.set(JSON.parse(JSON.stringify(keep)));cloud.status='synced';}
  catch(e){if(e&&e.code==='unavailable'){setTimeout(pushCloud,1500+Math.random()*1000);}else{cloud.status='local';cloud.ref=null;}}
  updateSyncNote();
}
async function initCloud(){
  try{
    const w=window.claude; if(!w||!w.use)return;
    const [db,user]=await Promise.all([w.use('db'),w.use('user')]);
    if(!db||!user)return;
    const uid=await user.id(); if(!uid)return;
    const ref=db.doc('data/users/'+uid+'/plan');
    const snap=await Promise.race([ref.get(),new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),10000))]);
    cloud.ref=ref;cloud.status='synced';
    if(snap.exists){
      const d=JSON.parse(JSON.stringify(snap.data()));
      if((d.savedAt||0)>(S.savedAt||0)){const v=S.view;if(d.setup)W=null;S=Object.assign(structuredClone(BLANK),d,{view:v||'today'});try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}render();return;}
    }
    if(S.setup)pushCloud();
    updateSyncNote();
  }catch(e){cloud.ref=null;cloud.status='local';updateSyncNote();}
}
function updateSyncNote(){const n=document.getElementById('syncnote');if(n)n.textContent=syncText();}
function syncText(){return cloud.status==='synced'?'Saved to your Claude account. Open this page on any device you are signed in on and your plan is there.':'Saved on this device. Your plan stays here between visits, but clearing your browser data resets it.';}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isFav=id=>!!(S.fav&&S.fav[id]);
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseYmd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function dayDate(i){const d=parseYmd(S.start||ymd(new Date()));d.setDate(d.getDate()+i);return d;}
const wk=d=>d.toLocaleDateString('en-CA',{weekday:'short'});
const md=d=>d.toLocaleDateString('en-CA',{month:'short',day:'numeric'});
function dayLabel(i){const d=dayDate(i);return wk(d)+' '+md(d);}
function todayIdx(){if(!S.start)return -1;const t=new Date();t.setHours(0,0,0,0);return Math.round((t-parseYmd(S.start))/86400000);}
function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening';}
function dayTotals(plan){return plan.items.map(buildItem).reduce((a,b)=>({k:a.k+b.t.k,p:a.p+b.t.p,c:a.c+b.t.c,f:a.f+b.t.f}),{k:0,p:0,c:0,f:0});}
function stateOf(v,t){if(!t)return 'good';const r=Math.abs(v-t)/den(t);return r<=0.05?'good':r<=0.10?'warn':'bad';}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200);}

// ---------- Target calculator (Mifflin-St Jeor) ----------
function calcTargets(b){
  const kg=b.units==='imp'?b.lb*0.4536:b.kg, cm=b.units==='imp'?(b.ft*12+b.inch)*2.54:b.cm;
  if(!(kg>30&&cm>120&&b.age>=16&&b.age<100))return null;
  const bmr=10*kg+6.25*cm-5*b.age+(b.sex==='m'?5:-161), tdee=bmr*b.act;
  const adj={lose:-500,slow:-250,keep:0,gain:300}[b.goal];
  const k=Math.max(b.sex==='m'?1500:1200,Math.round((tdee+adj)/10)*10);
  const p=Math.round(kg*(b.goal==='gain'?1.8:b.goal==='keep'?1.6:2.0)), f=Math.round(k*0.28/9), c=Math.max(50,Math.round((k-p*4-f*9)/4));
  return {k,p,c,f,tdee:Math.round(tdee)};
}

// ---------- Plan actions ----------
function buildWeek(startDate){
  const w=generateWeek(); if(w.error){toast(w.error);return false;}
  S.week=w;S.start=startDate||ymd(new Date());S.have={};S.done={};S.day=0;return true;
}
function swapMeal(d,i){
  const plan=S.week[d], slots=LAYOUTS[plan.layout], P=pools(slots), used=usage(d), cur=plan.items.map(x=>x.id);
  const alts=P[i].filter(id=>!cur.includes(id));
  if(!alts.length){toast('No other recipes fit this meal with your diet settings.');return;}
  const res=alts.map(id=>{const r=cur.slice();r[i]=id;const o=optimize(r,slots,plan.T);o.v+=pen(o.rids,used);return o;}).sort((a,b)=>a.v-b.v);
  const ch=pick(res.slice(0,3));plan.items=ch.rids.map((id,k)=>({id,s:ch.sc[k]}));delete S.done[d+'-'+i];save();render();
}
function addToDay(id,d){
  if(!S.week){toast('Set up your plan first.');return;}
  const plan=S.week[d], slots=LAYOUTS[plan.layout], r=R[id], cur=plan.items.map(x=>x.id);
  const fits=slots.map((s,i)=>i).filter(i=>slotAccepts(slots[i],r)&&cur[i]!==id);
  if(!fits.length){toast(`${dayLabel(d)} has no ${courseOf(r).toLowerCase()} slot for this recipe.`);return;}
  const best=fits.map(i=>{const rr=cur.slice();rr[i]=id;return {i,o:optimize(rr,slots,plan.T)};}).sort((a,b)=>a.o.v-b.o.v)[0];
  plan.items=best.o.rids.map((x,k)=>({id:x,s:best.o.sc[k]}));save();
  toast(`Added to ${dayLabel(d)} as ${slots[best.i].l.toLowerCase()}. Portions re-balanced.`);
}
function toggleFav(id){
  if(S.fav[id])delete S.fav[id];else S.fav[id]=Date.now();save();
  document.querySelectorAll(`[data-fav="${id}"]`).forEach(b=>{const on=isFav(id);b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.setAttribute('aria-label',(on?'Remove from':'Add to')+' favorites');const s=b.querySelector('span');if(s)s.textContent=on?'Favorite':'Add to favorites';});
  toast(isFav(id)?`Saved ${R[id].name} to favorites.`:`Removed ${R[id].name} from favorites.`);
  if(S.view==='recipes'&&S.course==='fav')render();
}
function courseOf(r){return r.cat==='b'?'Breakfast':r.cat==='s'?'Snack':r.when==='lunch'?'Lunch':r.when==='dinner'?'Dinner':'Lunch or dinner';}
function tagsOf(r){const t=[];if(!r.meat&&!r.fish)t.push('vegetarian');if(!r.dairy)t.push('dairy-free');if(r.fish)t.push('fish');return t.join(' · ');}
function favBtn(id,small){const on=isFav(id);return `<button type="button" class="fav${on?' on':''}${small?' sm':''}" data-fav="${id}" aria-pressed="${on}" aria-label="${on?'Remove from':'Add to'} favorites">${HEART}<span>${on?'Favorite':'Add to favorites'}</span></button>`;}

      ${b.units==='imp'?`<div class="g2"><div class="field"><label for="b-ft">Height</label><div class="inp"><input id="b-ft" data-n="ft" type="number" inputmode="numeric" value="${b.ft}"><span>ft</span></div></div><div class="field"><label for="b-in">&nbsp;</label><div class="inp"><input id="b-in" data-n="inch" type="number" inputmode="numeric" value="${b.inch}" aria-label="Height inches"><span>in</span></div></div></div>`:`<div class="field"><label for="b-cm">Height</label><div class="inp"><input id="b-cm" data-n="cm" type="number" inputmode="numeric" value="${b.cm}"><span>cm</span></div></div>`}

      <div class="field"><span class="lbl">Goal</span><div class="opts">${[['lose','Lose weight','About 1 lb a week'],['slow','Lose slowly','About ½ lb a week'],['keep','Maintain','Stay where I am'],['gain','Build muscle','Small surplus']].map(([v,l,s])=>`<label class="opt"><input type="radio" name="goal" value="${v}" ${b.goal===v?'checked':''}><div><b>${l}</b><small>${s}</small></div></label>`).join('')}</div></div>

      <div class="g2" style="grid-template-columns:repeat(3,minmax(0,1fr))">${[['p','Protein','d-p'],['c','Carbs','d-c'],['f','Fat','d-f']].map(([k,l,d])=>`<div class="field"><label for="w-${k}"><i class="dot ${d}"></i>${l}</label><div class="inp"><input id="w-${k}" data-t="${k}" type="number" inputmode="numeric" value="${W.T[k]}"><span>g</span></div></div>`).join('')}</div>

    }

    <div class="card">
      <div class="field"><span class="lbl">Meals per day</span><div class="opts">${[['2','2 meals','Great with intermittent fasting'],['2s','2 meals + snack',''],['3','3 meals','Breakfast, lunch, dinner'],['3s','3 meals + snack','Most popular'],['3ss','3 meals + 2 snacks','Smaller, more often']].map(([v,l,s])=>`<label class="opt"><input type="radio" name="layout" value="${v}" ${W.layout===v?'checked':''}><div><b>${l}</b><small>${s||'&nbsp;'}</small></div></label>`).join('')}</div></div>
      <div class="field"><span class="lbl">Anything to avoid?</span><div class="chips">
        <label class="chip"><input type="checkbox" id="w-veg" ${W.veg?'checked':''}><span>Vegetarian</span></label>

    </div>`;

  app.innerHTML=h;

  const err=m=>{const e=$('w-err');e.textContent=m;e.hidden=false;};

function resultHtml(r){return `<div class="eyebrow">Your starting targets</div>
  <div class="g4">${[['Calories',r.k,'kcal','d-k'],['Protein',r.p,'g','d-p'],['Carbs',r.c,'g','d-c'],['Fat',r.f,'g','d-f']].map(([l,v,u,d])=>`<div><div class="note"><i class="dot ${d}"></i> ${l}</div><div class="num" style="font-size:1.3rem;font-weight:600">${fmt(v)}<span class="note"> ${u}</span></div></div>`).join('')}</div>
  <p class="fine">Estimated from your details (about ${fmt(r.tdee)} kcal a day to maintain). It is a starting point: adjust it any time from your profile.</p>`;}

// ---------- Main app shell ----------
function render(){
  const app=$('app');
  if(W||!S.setup){if(!W)startWizard();return renderWizard(app);}
  const ti=todayIdx(), inWeek=ti>=0&&ti<7;
  if(S.view==='today'&&!inWeek)S.view='week';
  const tabs=[['today','Today'],['week','Week'],['groceries','Groceries'],['recipes','Recipes'],['me',S.name||'Me']];
  const tabView=S.view==='day'?'week':S.view;
  const end=dayDate(6);
  let sub=ti<0?`Your week starts ${wk(dayDate(0))} ${md(dayDate(0))}.`:ti>6?`Your week ended ${md(end)}.`:`Day ${ti+1} of 7 · ${md(dayDate(0))} to ${md(end)}`;
  app.innerHTML=`<header class="mast"><div><div class="brand">Macro <span>Plate</span></div><h1>${greeting()}, ${esc(S.name)}.</h1><p class="sub">${sub}</p></div>
    <div class="note mono">${fmt(S.T.k)} kcal · P ${S.T.p} · C ${S.T.c} · F ${S.T.f}</div></header>
    <nav class="tabs" aria-label="Sections">${tabs.map(([k,l])=>`<button type="button" data-view="${k}" class="${tabView===k?'on':''}" ${k==='today'&&!inWeek?'disabled style="opacity:.4"':''}>${ICON[k]}<span>${esc(l)}</span></button>`).join('')}</nav>
    ${ti>6?`<div class="banner"><span>Your last plan ended on ${wk(end)} ${md(end)}. Ready for a new week?</span><button class="btn" type="button" id="nextweek">Plan a new week</button></div>`:''}
    <section id="view" style="display:grid;gap:18px;min-width:0"></section>`;
  app.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{S.view=b.dataset.view;save();render();window.scrollTo({top:0});});
  if($('nextweek'))$('nextweek').onclick=()=>{if(buildWeek(ymd(new Date()))){S.view='today';save();render();toast('New week planned. Your favorites carried over.');}};
  const v=$('view');
  ({today:()=>renderDay(v,ti,true),week:()=>renderWeek(v),day:()=>renderDay(v,S.day,false),groceries:()=>renderGroceries(v),recipes:()=>renderRecipes(v),me:()=>renderMe(v)}[S.view]||(()=>renderWeek(v)))();
}

function meter(lbl,dot,val,tgt,unit,color){
  const st=stateOf(val,tgt), d=val-tgt, pct=Math.min(120,tgt?val/tgt*100:0);
  return `<div class="meter"><div class="top"><span><i class="dot ${dot}"></i> ${lbl}</span><span class="pill ${st}">${d>=0?'+':'−'}${fmt(Math.abs(d))}${unit==='kcal'?'':' g'}</span></div>
  <div class="val">${fmt(val)}<small> / ${fmt(tgt)} ${unit}</small></div><div class="bar"><i style="width:${pct/1.2}%;background:${color}"></i><b></b></div></div>`;
}

function renderWeek(v){
  const ti=todayIdx(), uniq=new Set(S.week.flatMap(p=>p.items.map(x=>x.id))).size;
  const made=Object.keys(S.done).length, total=S.week.reduce((a,p)=>a+p.items.length,0);
  let h=`<div class="sumhead"><div><div class="eyebrow">Your week · ${uniq} different recipes</div><h2>${wk(dayDate(0))} ${md(dayDate(0))} to ${wk(dayDate(6))} ${md(dayDate(6))}</h2></div>
    <div class="row"><span class="note">${made} of ${total} meals made</span><button class="btn ghost" type="button" data-go="groceries">Grocery list</button></div></div>
    <div class="weeklist">`;
  S.week.forEach((p,d)=>{
    const slots=LAYOUTS[p.layout], t=dayTotals(p), st=stateOf(t.k,p.T.k), dt=dayDate(d);
    const n=p.items.filter((x,i)=>S.done[d+'-'+i]).length;
    h+=`<button type="button" class="wday${d===ti?' today':''}" data-day="${d}">
      <div class="dt"><small>${d===ti?'Today':wk(dt)}</small><b>${md(dt)}</b></div>
      <ul>${p.items.map((x,i)=>`<li class="${S.done[d+'-'+i]?'made':''}"><em>${esc(slots[i].l)}</em>${esc(R[x.id].name)}</li>`).join('')}</ul>
      <div class="kc"><span><i class="sd ${st}"></i> ${fmt(t.k)} kcal</span><small>P ${fmt(t.p)} · C ${fmt(t.c)} · F ${fmt(t.f)}</small><small>${n}/${p.items.length} made</small></div></button>`;
  });
  h+='</div><p class="fine">Tap a day to see its recipes. The dot shows how close the day lands to your calories: green within 5%, amber within 10%.</p>';
  v.innerHTML=h;
  v.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{S.day=+b.dataset.day;S.view='day';save();render();window.scrollTo({top:0});});
  v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.view=b.dataset.go;save();render();});
}

function renderDay(v,d,isToday){
  if(d<0||d>6||!S.week[d]){v.innerHTML='<div class="empty">No plan for today.</div>';return;}
  const plan=S.week[d], slots=LAYOUTS[plan.layout], built=plan.items.map(buildItem), T=plan.T;
  const tot=built.reduce((a,b)=>({k:a.k+b.t.k,p:a.p+b.t.p,c:a.c+b.t.c,f:a.f+b.t.f}),{k:0,p:0,c:0,f:0});
  const nextI=plan.items.findIndex((x,i)=>!S.done[d+'-'+i]);
  let h='';
  if(!isToday)h+=`<div class="row"><button class="btn ghost" type="button" id="back">← Week</button></div><div class="daystrip" role="tablist">${S.week.map((p,i)=>`<button type="button" class="${i===d?'on':''}" data-day="${i}" role="tab" aria-selected="${i===d}">${wk(dayDate(i))}<small>${md(dayDate(i))}</small></button>`).join('')}</div>`;
  h+=`<div class="sumhead"><div><div class="eyebrow">${isToday?'Today':wk(dayDate(d))} · ${md(dayDate(d))}</div><h2>${nextI<0?'All meals made. Nice work.':`Up next: ${esc(R[plan.items[nextI].id].name)}`}</h2></div>
    <button class="btn ghost" type="button" id="reroll">New meals for this day</button></div>
    <div class="meters">${meter('Calories','d-k',tot.k,T.k,'kcal','var(--ink)')}${meter('Protein','d-p',tot.p,T.p,'g','var(--pro)')}${meter('Carbs','d-c',tot.c,T.c,'g','var(--carb)')}${meter('Fat','d-f',tot.f,T.f,'g','var(--fat)')}</div><div class="tickets">`;
  built.forEach((b,i)=>{
    const t=b.t, cal=t.p*4+t.c*4+t.f*9||1, done=!!S.done[d+'-'+i];
    h+=`<article class="ticket${done?' made':''}">
      <div class="tk-head"><span><strong>${esc(slots[i].l)}</strong></span><span>${b.r.t} min</span></div>
      <div class="tk-body">
        <div class="rtitle"><h3>${esc(b.r.name)}</h3>${favBtn(b.r.id,true)}</div>
        <div class="tk-mac"><span class="kc">${fmt(t.k)} kcal</span><span><i class="dot d-p"></i>P ${fmt(t.p)}</span><span><i class="dot d-c"></i>C ${fmt(t.c)}</span><span><i class="dot d-f"></i>F ${fmt(t.f)}</span></div>
        <div class="split" aria-hidden="true"><i style="flex:${t.p*4/cal};background:var(--pro)"></i><i style="flex:${t.c*4/cal};background:var(--carb)"></i><i style="flex:${t.f*9/cal};background:var(--fat)"></i></div>
        ${b.r.note?`<p class="note">${esc(b.r.note)}</p>`:''}
        <ul class="ing">${b.lines.map(l=>`<li><span>${esc(l.name)}</span><span class="amt">${l.label}</span></li>`).join('')}</ul>
        <details ${i===nextI&&isToday?'open':''}><summary>How to make it</summary><ol>${b.r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></details>
      </div>
      <div class="tk-foot"><button class="btn ghost made-btn${done?' on':''}" type="button" data-made="${i}" aria-pressed="${done}">${done?'✓ Made it':'Mark as made'}</button><button class="btn ghost" type="button" data-swap="${i}">Swap meal</button></div>
    </article>`;
  });
  h+='</div>';
  v.innerHTML=h;
  if($('back'))$('back').onclick=()=>{S.view='week';save();render();};
  v.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{S.day=+b.dataset.day;save();render();});
  $('reroll').onclick=()=>{const p=generate(usage(d));if(p.error)return toast(p.error);S.week[d]=p;plan.items.forEach((x,i)=>delete S.done[d+'-'+i]);save();render();toast('New meals for this day. Your grocery list is updated.');};
  v.querySelectorAll('[data-swap]').forEach(b=>b.onclick=()=>swapMeal(d,+b.dataset.swap));
  v.querySelectorAll('[data-made]').forEach(b=>b.onclick=()=>{const k=d+'-'+b.dataset.made;if(S.done[k])delete S.done[k];else S.done[k]=1;save();render();});
  v.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>toggleFav(b.dataset.fav));
}

function renderGroceries(v){
  const scope=S.scope==='rest'?'rest':'week', ti=todayIdx(), from=scope==='rest'?Math.max(0,ti):0;
  const agg={};
  S.week.forEach((p,d)=>{if(d<from)return;p.items.forEach((it,i)=>{if(scope==='rest'&&S.done[d+'-'+i])return;buildItem(it).lines.forEach(l=>agg[l.id]=(agg[l.id]||0)+l.g);});});
  const aisles={}, order=['Meat & protein','Produce & frozen','Dairy & eggs','Pantry'];
  Object.entries(agg).sort((a,b)=>ING[a[0]].n.localeCompare(ING[b[0]].n)).forEach(([id,g])=>{const I=ING[id];(aisles[I.a]=aisles[I.a]||[]).push({id,name:I.n,label:roundAmt(id,g,true).label});});
  const ids=Object.keys(agg), got=ids.filter(id=>S.have[id]).length;
  let h=`<div class="sumhead"><div><div class="eyebrow">Groceries</div><h2>${got===ids.length&&ids.length?'Everything’s in the cart.':`${ids.length-got} items to get`}</h2></div>
    <div class="row"><div class="seg" role="group" aria-label="List covers"><button type="button" data-scope="week" class="${scope==='week'?'on':''}">Whole week</button>${ti>0&&ti<7?`<button type="button" data-scope="rest" class="${scope==='rest'?'on':''}">Rest of the week</button>`:''}</div>
    <button class="btn ghost" type="button" id="copy">Copy list</button>${got?'<button class="btn ghost" type="button" id="clear">Untick all</button>':''}</div></div>
    <div class="progress" aria-label="${got} of ${ids.length} items ticked"><i style="width:${ids.length?got/ids.length*100:0}%"></i></div>
    <div class="aisles" id="aisles">${order.filter(a=>aisles[a]).map(a=>`<div class="aisle"><h3><span>${a}</span><span>${aisles[a].filter(x=>S.have[x.id]).length}/${aisles[a].length}</span></h3><ul class="ing">${aisles[a].map(x=>`<li class="buy${S.have[x.id]?' got':''}"><label><input type="checkbox" data-have="${x.id}" ${S.have[x.id]?'checked':''}><span>${esc(x.name)}</span></label><span class="amt">${x.label}</span></li>`).join('')}</ul></div>`).join('')}</div>
    <p class="fine">Amounts cover ${scope==='week'?'all 7 days':'the meals you have not made yet'}. Rice and quinoa are cooked weight, so buy about a third of that dry. Fresh fish and salad greens keep 2 to 3 days: buy frozen, or pick them up mid-week.</p>`;
  v.innerHTML=h;
  v.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{S.scope=b.dataset.scope;save();render();});
  v.querySelectorAll('[data-have]').forEach(c=>c.onchange=()=>{if(c.checked)S.have[c.dataset.have]=1;else delete S.have[c.dataset.have];save();render();});
  if($('clear'))$('clear').onclick=()=>{S.have={};save();render();};
  $('copy').onclick=()=>{
    const txt=`Groceries for ${md(dayDate(0))} to ${md(dayDate(6))}\n\n`+order.filter(a=>aisles[a]).map(a=>a.toUpperCase()+'\n'+aisles[a].filter(x=>!S.have[x.id]).map(x=>`- ${x.name}: ${x.label}`).join('\n')).join('\n\n');
    navigator.clipboard.writeText(txt).then(()=>toast('List copied. Paste it into a note or a text.'),()=>{const r=document.createRange();r.selectNodeContents($('aisles'));const s=getSelection();s.removeAllRanges();s.addRange(r);toast('Copy is blocked here. The list is selected so you can copy it yourself.');});
  };
}

const COURSES=[['all','All'],['b','Breakfast'],['L','Lunch'],['D','Dinner'],['s','Snacks'],['fav','Favorites']];
function renderRecipes(v){
  const course=S.course||'all', q=(S.q||'').trim().toLowerCase(), sort=S.sort||'time';
  let list=RECIPES.filter(r=>course==='fav'?isFav(r.id):course==='b'||course==='s'?r.cat===course:course==='L'?(r.cat==='m'&&r.when!=='dinner'):course==='D'?(r.cat==='m'&&r.when!=='lunch'):true);
  if(q)list=list.filter(r=>(r.name+' '+r.ing.map(x=>ING[x[0]].n).join(' ')).toLowerCase().includes(q));
  if(S.applyDiet)list=list.filter(eligible);
  const sorters={time:(a,b)=>a.t-b.t,protein:(a,b)=>b.p-a.p,ratio:(a,b)=>(b.p/b.k)-(a.p/a.k),kcal:(a,b)=>a.k-b.k,az:(a,b)=>a.name.localeCompare(b.name),recent:(a,b)=>(S.fav[b.id]||0)-(S.fav[a.id]||0)};
  list.sort(sorters[sort]||sorters.time);
  const ti=todayIdx(), target=ti>=0&&ti<7?ti:0;
  let h=`<div class="sumhead"><div><div class="eyebrow">Recipe box · ${RECIPES.length} recipes</div><h2>${course==='fav'?'Your favorites':COURSES.find(c=>c[0]===course)[1]+(course==='all'?' recipes':'')}</h2></div></div>
  <div class="seg wide" role="tablist" aria-label="Course">${COURSES.map(([k,l])=>`<button type="button" role="tab" aria-selected="${k===course}" class="${k===course?'on':''}" data-course="${k}">${k==='fav'?HEART:''}${l}${k==='fav'?` <span class="num">(${Object.keys(S.fav).length})</span>`:''}</button>`).join('')}</div>
  <div class="rbar"><div class="inp grow"><input id="rq" type="search" placeholder="Search recipes or ingredients" value="${esc(S.q||'')}" aria-label="Search recipes"></div>
    <select id="rsort" aria-label="Sort">${[['time','Quickest first'],['protein','Most protein'],['ratio','Most protein per calorie'],['kcal','Fewest calories'],['az','A to Z'],...(course==='fav'?[['recent','Recently saved']]:[])].map(([k,l])=>`<option value="${k}" ${k===sort?'selected':''}>${l}</option>`).join('')}</select>
    <label class="chip"><input type="checkbox" id="rdiet" ${S.applyDiet?'checked':''}><span>Fits my diet</span></label></div>`;
  if(!list.length)h+=course==='fav'&&!q?'<div class="empty">No favorites yet. Tap the heart on any recipe or on a meal in your plan to save it here.</div>':'<div class="empty">No recipes match. Try another search or untick “Fits my diet”.</div>';
  else h+='<div class="tickets">'+list.map(r=>{const cal=r.p*4+r.c*4+r.f*9||1;return `<article class="ticket">
      <div class="tk-head"><span><strong>${courseOf(r)}</strong></span><span>${r.t} min</span></div>
      <div class="tk-body"><div class="rtitle"><h3>${esc(r.name)}</h3>${favBtn(r.id,true)}</div>
        <div class="tk-mac"><span class="kc">${fmt(r.k)} kcal</span><span><i class="dot d-p"></i>P ${fmt(r.p)}</span><span><i class="dot d-c"></i>C ${fmt(r.c)}</span><span><i class="dot d-f"></i>F ${fmt(r.f)}</span></div>
        <div class="split" aria-hidden="true"><i style="flex:${r.p*4/cal};background:var(--pro)"></i><i style="flex:${r.c*4/cal};background:var(--carb)"></i><i style="flex:${r.f*9/cal};background:var(--fat)"></i></div>
        <p class="note">Base serving${tagsOf(r)?' · '+tagsOf(r):''}. Your plan scales it to your targets.</p>
        <details><summary>Ingredients and method</summary><ul class="ing">${r.ing.map(([id,g])=>`<li><span>${esc(ING[id].n)}</span><span class="amt">${roundAmt(id,g).label}</span></li>`).join('')}</ul><ol>${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></details></div>
      <div class="tk-foot"><button class="btn ghost" type="button" data-add="${r.id}">Add to ${target===ti?'today':wk(dayDate(target))}</button></div></article>`;}).join('')+'</div>';
  v.innerHTML=h;
  v.querySelectorAll('[data-course]').forEach(b=>b.onclick=()=>{S.course=b.dataset.course;if(S.sort==='recent'&&S.course!=='fav')S.sort='time';save();render();});
  const rq=$('rq');rq.oninput=()=>{S.q=rq.value;const pos=rq.selectionStart;render();const n=$('rq');n.focus();try{n.setSelectionRange(pos,pos);}catch(e){}};
  $('rsort').onchange=e=>{S.sort=e.target.value;save();render();};
  $('rdiet').onchange=e=>{S.applyDiet=e.target.checked;save();render();};
  v.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addToDay(b.dataset.add,target));
  v.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>toggleFav(b.dataset.fav));
}

let confirmReset=false;
function renderMe(v){
  const lay={'2':'2 meals','2s':'2 meals + snack','3':'3 meals','3s':'3 meals + snack','3ss':'3 meals + 2 snacks'}[S.layout];
  const diet=[S.veg&&'Vegetarian',S.nofish&&'No fish',S.df&&'Dairy-free'].filter(Boolean).join(', ')||'No restrictions';
  let h=`<div class="sumhead"><div><div class="eyebrow">Your profile</div><h2>${esc(S.name)}</h2></div><button class="btn ghost" type="button" id="redo">Redo setup</button></div>
  <div class="stats"><div class="stat"><b>${fmt(S.T.k)}</b><span>kcal a day</span></div><div class="stat"><b>${S.T.p} g</b><span>protein</span></div><div class="stat"><b>${S.T.c} g</b><span>carbs</span></div><div class="stat"><b>${S.T.f} g</b><span>fat</span></div><div class="stat"><b>${Object.keys(S.fav).length}</b><span>favorites</span></div></div>
  <form class="card" id="meform" novalidate><h3>Change your plan</h3>
    <div class="g4">${[['k','Calories','kcal','d-k'],['p','Protein','g','d-p'],['c','Carbs','g','d-c'],['f','Fat','g','d-f']].map(([k,l,u,d])=>`<div class="field"><label for="m-${k}"><i class="dot ${d}"></i>${l}</label><div class="inp"><input id="m-${k}" type="number" inputmode="numeric" value="${S.T[k]}"><span>${u}</span></div></div>`).join('')}</div>
    <div class="g2"><div class="field"><label for="m-layout">Meals per day</label><select id="m-layout">${Object.entries({'2':'2 meals','2s':'2 meals + snack','3':'3 meals','3s':'3 meals + snack','3ss':'3 meals + 2 snacks'}).map(([k,l])=>`<option value="${k}" ${k===S.layout?'selected':''}>${l}</option>`).join('')}</select></div>
    <div class="field"><label for="m-maxT">Cooking time per meal</label><select id="m-maxT">${[[0,'Up to 35 minutes'],[25,'25 minutes or less'],[15,'15 minutes or less']].map(([k,l])=>`<option value="${k}" ${+S.maxT===k?'selected':''}>${l}</option>`).join('')}</select></div></div>
    <div class="chips"><label class="chip"><input type="checkbox" id="m-veg" ${S.veg?'checked':''}><span>Vegetarian</span></label><label class="chip"><input type="checkbox" id="m-nofish" ${S.nofish?'checked':''}><span>No fish or seafood</span></label><label class="chip"><input type="checkbox" id="m-df" ${S.df?'checked':''}><span>Dairy-free</span></label><label class="chip"><input type="checkbox" id="m-fb" ${S.favBias?'checked':''}><span>Use my favorites more</span></label></div>
    <p class="err" id="m-err" hidden></p>
    <div class="row"><button class="btn" type="submit">Save and re-plan the rest of this week</button></div>
    <p class="fine">Days already behind you stay as they were. Favorites are kept.</p></form>
  <div class="card"><h3>Your data</h3><p class="note" id="syncnote">${syncText()}</p>
    <div class="row">${confirmReset?'<span class="note">This deletes your plan, favorites and settings.</span><button class="btn danger" type="button" id="reset2">Delete everything</button><button class="btn ghost" type="button" id="reset0">Keep my data</button>':'<button class="btn ghost" type="button" id="reset1">Start over</button>'}</div></div>
  <p class="fine">Current plan: ${lay} · ${diet}. Nutrition is estimated from standard values for each ingredient.</p>`;
  v.innerHTML=h;
  $('redo').onclick=()=>{startWizard();render();window.scrollTo(0,0);};
  $('meform').onsubmit=e=>{e.preventDefault();
    const T={k:+$('m-k').value,p:+$('m-p').value,c:+$('m-c').value,f:+$('m-f').value}, er=$('m-err');
    if(!(T.k>=800&&T.k<=6000)){er.textContent='Calories need to be between 800 and 6,000.';er.hidden=false;return;}
    Object.assign(S,{T,layout:$('m-layout').value,maxT:+$('m-maxT').value,veg:$('m-veg').checked,nofish:$('m-nofish').checked,df:$('m-df').checked,favBias:$('m-fb').checked});
    const ti=Math.max(0,todayIdx());
    if(ti>6){buildWeek(ymd(new Date()));}else{const used={};for(let d=0;d<7;d++){if(d<ti){S.week[d].items.forEach(x=>used[x.id]=(used[x.id]||0)+1);continue;}const p=generate(used);if(p.error){er.textContent=p.error;er.hidden=false;return;}S.week[d]=p;p.items.forEach((x,i)=>{used[x.id]=(used[x.id]||0)+1;delete S.done[d+'-'+i];});}}
    save();S.view='week';render();toast('Saved. The rest of your week is re-planned.');
  };
  if($('reset1'))$('reset1').onclick=()=>{confirmReset=true;render();};
  if($('reset0'))$('reset0').onclick=()=>{confirmReset=false;render();};
  if($('reset2'))$('reset2').onclick=()=>{confirmReset=false;S=structuredClone(BLANK);save();W=null;render();};
}

// ---------- Boot ----------
render();
initCloud();
</script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
